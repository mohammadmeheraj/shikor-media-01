<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&amp;family=Noto+Serif+Bengali:wght@600;800&amp;family=Exo+2:ital,wght@1,800&amp;display=swap" rel="stylesheet"/><link href="/assets/favicon.png" rel="icon" type="image/png"/><style>:root{--ink:#0c0d12;--red:#d62828;--paper:#fff;--bg:#f1f2f4;--line:#dde0e5;--text:#1b2430;--mute:#66707d}

<body>
<div id="top"></div>
<main class="wrap" id="app"></main>
<div id="foot"></div>
<script>/* শিকড় মিডিয়া — shared data + layout. Content is loaded from the Netlify API. */
var CATS=['জাতীয়','রাজনীতি','অর্থনীতি','খেলা','বিনোদন','আন্তর্জাতিক','প্রযুক্তি'];
var DB={posts:null,settings:null};
function boot(cb){fetch('/api/data').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){DB=d;DB._t=Date.now()}).catch(function(){DB=DB||{};DB._err=1}).then(cb)}
function apiSave(k,d){return fetch('/api/'+k,{method:'PUT',headers:{'content-type':'application/json',authorization:'Bearer '+sessionStorage.getItem('sk_tok')},body:JSON.stringify(d)}).then(function(r){if(r.status===401){sessionStorage.removeItem('sk_tok');location.reload()}if(!r.ok)throw 0;if(k==='posts')DB.posts=d;else if(k==='ads')DB.ads=d;else DB.settings=d})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
var now=Date.now();
function posts(){var p=DB&&DB.posts||[];return p.slice().sort(function(a,b){return b.date-a.date})}
function isLive(p){return p.status!=='off'&&p.status!=='draft'&&(!p.pub||Date.now()>=p.pub)&&(!p.exp||Date.now()<p.exp)}
function liveposts(){return posts().filter(isLive)}
function settings(){var d={ad:'',adText:'স্পনসর্ড কনটেন্ট দেখুন',breaking:'',addr:'ঢাকা, বাংলাদেশ'},o={},k,x=DB&&DB.settings||{};for(k in d)o[k]=d[k];for(k in x)o[k]=x[k];return o}
var BN='০১২৩৪৫৬৭৮৯';function bn(n){return String(n).replace(/\d/g,function(d){return BN[d]})}
function fdate(t){try{return new Date(t).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'})}catch(e){return bn(new Date(t).toDateString())}}
function ph(p){var i=CATS.indexOf(p.cat)%4;return p.img?'<img src="'+esc(p.img)+'" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=ph></div>\'">':'<div class="ph c'+i+'"></div>'}
function adSlot(c){var t=Date.now(),l=(DB&&DB.ads||[]).filter(function(a){return a.slot===c&&a.on!==false&&/^https?:\/\//.test(a.url)&&(!a.exp||t<a.exp)});if(!l.length)return '';var a=l[Math.floor(Math.random()*l.length)];(window._imp=window._imp||{})[a.id]=1;
 return '<aside class="ad '+c+'" aria-label="বিজ্ঞাপন"><small>বিজ্ঞাপন</small><a href="'+esc(a.url)+'" target="_blank" rel="sponsored noopener" data-ad="'+esc(a.id)+'">'+(/^https?:\/\//.test(a.img||'')?'<img src="'+esc(a.img)+'" alt="'+esc(a.name)+'" loading="lazy">':esc(a.text||'বিস্তারিত দেখুন'))+'</a></aside>'}
function card(p){return '<a class="card" href="article.html?id='+esc(p.id)+'"><div class="thumb">'+ph(p)+'</div><div class="b"><span class="meta">'+esc(p.cat)+'</span>'+(Date.now()-p.date<108e5?' <span class="new">নতুন</span>':'')+'<h3>'+esc(p.title)+'</h3><span class="meta">'+fdate(p.date)+'</span></div></a>'}
function row(p){return '<a class="row" href="article.html?id='+esc(p.id)+'"><div class="thumb">'+ph(p)+'</div><div><h3>'+esc(p.title)+'</h3><span class="meta">'+fdate(p.date)+'</span></div></a>'}
function chrome(active){
 var s=settings(),ps=liveposts().slice(0,6);
 var nav='<a href="index.html" class="'+(!active?'on':'')+'">প্রচ্ছদ</a>'+CATS.map(function(c){return '<a href="index.html?cat='+encodeURIComponent(c)+'" class="'+(active===c?'on':'')+'">'+esc(c)+'</a>'}).join('');
 var tick=(s.breaking?'<a href="#">'+esc(s.breaking)+'</a>':'')+ps.map(function(p){return '<a href="article.html?id='+esc(p.id)+'">'+esc(p.title)+'</a>'}).join('');
 document.getElementById('top').innerHTML='<header class="head"><div class="wrap"><a class="brand" href="index.html" aria-label="SHIKOR-MEDIA শিকড় মিডিয়া"><img class="emb" src="/assets/logo.png" alt=""><span class="bt"><b><i>SHIKOR</i>-MEDIA</b><small>শিকড় মিডিয়া</small></span></a></div></header><div class="top"><div class="wrap"><span id="now">'+fdate(Date.now())+'</span><span>বাংলাদেশ ও আন্তর্জাতিক খবর</span></div></div><nav aria-label="বিভাগ"><div class="wrap">'+nav+'<form class="search nsearch" action="index.html" role="search"><input name="q" placeholder="খবর খুঁজুন" aria-label="খবর খুঁজুন"><button>খুঁজুন</button></form></div></nav><div class="wrap"><div class="ticker"><b>শিরোনাম</b><div><span>'+tick+'</span></div></div></div>';
 document.getElementById('foot').innerHTML=footerHtml(s);if(!window._clk){window._clk=1;setInterval(function(){var e=document.getElementById('now');if(e)e.textContent=fdate(Date.now())},30000)}}

function strip(ps){if(!ps.length)return '';var l=ps.slice(0,8);while(l.length<6)l=l.concat(ps.slice(0,8));
 var c=l.map(function(p){return '<a class="sb" href="article.html?id='+esc(p.id)+'"><div class="sbt">'+ph(p)+'</div><div class="sbx"><small>'+esc(p.cat)+'</small><h3>'+esc(p.title)+'</h3></div></a>'}).join('');
 return '<section class="strip" aria-label="সর্বশেষ খবর"><div class="track" style="animation-duration:'+(l.length*6)+'s">'+c+'<span class="dup" aria-hidden="true" style="display:contents">'+c.replace(/<a /g,'<a tabindex="-1" ')+'</span></div></section>'}

function srow(p){return '<a class="srow" href="article.html?id='+esc(p.id)+'"><div class="thumb">'+ph(p)+'</div><div><h3>'+esc(p.title)+'</h3><span class="meta">'+esc(p.cat)+' · '+fdate(p.date)+'</span></div></a>'}
function ltext(p){return '<a class="lt" href="article.html?id='+esc(p.id)+'">'+esc(p.title)+'</a>'}
function wireTabs(){var b=document.querySelectorAll('.tabs2 button');b.forEach(function(x){x.onclick=function(){b.forEach(function(y){y.classList.toggle('on',y===x)});document.getElementById('pa').hidden=x.dataset.p!=='a';document.getElementById('pb').hidden=x.dataset.p!=='b'}})}
function catSecs(all){return CATS.map(function(c){var l=all.filter(function(p){return p.cat===c}).slice(0,4);return l.length?'<div class="sec"><h2>'+esc(c)+'</h2><a href="index.html?cat='+encodeURIComponent(c)+'">আরও →</a></div><div class="grid g4">'+l.map(card).join('')+'</div>':''}).join('')}

function footerHtml(s){var y=bn(new Date().getFullYear()),u=function(x){return /^https?:\/\//.test(x||'')},ct=function(l,v){return v?'<div><b>'+l+'</b> '+esc(v)+'</div>':''};
